title: 'Capture the Flag 2026'
type: ctf
startDate: '2026-03-20T10:00'
endDate: '2026-03-20T16:30'
location: Virtual
description: >-
  A virtual Capture the Flag competition designed to sharpen your cybersecurity skills. Free, beginner-friendly, and open to students from any institution. No prior experience required, just curiosity, problem-solving skills, and a willingness to learn and have fun. Participate in teams of three, with prizes and guest speakers.
flyer: /images/uploads/capture-the-flag-2026/flyer.jpg
recap: >-
  The CTF was sponsored by Abitronix and featured two guest speakers:
  Kimberly Opara, a Kean alum working at Oracle as a Cloud Engineer, and
  Christina Morillo, Senior Director of Information Technology at the New
  York Football Giants.
highlights:
  - Sponsored by Abitronix
  - Guest speaker Kimberly Opara, Kean alum and Cloud Engineer at Oracle
  - >-
    Guest speaker Christina Morillo, Senior Director of Information
    Technology at the New York Football Giants
