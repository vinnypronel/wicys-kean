initiativeTitle: Fall 2026 career prep and CTF series
initiativeBody: >-
  This semester we are focused on getting members internship and job ready
  while building up to our Capture the Flag competition in spring 2027.
initiativePoints:
  - Resume and interview prep sessions
  - Study groups for Security+ and Network+
sponsorshipBlurb: >-
  We are looking for partners to support our spring 2027 Capture the Flag
  competition and our workshop series. Sponsors get visibility with motivated
  cybersecurity students at Kean University.
