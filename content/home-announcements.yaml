initiativeTitle: Building our Fall 2026 mentorship program
initiativeBody: >-
  We are pairing members with mentors from the cybersecurity industry and
  Kean alumni to talk internships, certifications, and career paths. Sign-ups
  open at our first general body meeting.
initiativePoints:
  - One-on-one pairings with industry mentors
  - Resume and interview prep sessions
  - Study groups for Security+ and Network+
sponsorshipBlurb: >-
  We are looking for partners to support our Fall 2026 Capture the Flag
  competition and workshop series. Sponsors get direct access to motivated
  cybersecurity students at Kean University.
