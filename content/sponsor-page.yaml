intro: >-
  WiCyS Kean gives companies direct access to motivated, skilled students at
  Kean University. Whether you can contribute funding, prizes, or people,
  there is a way for your organization to make an impact.
benefits:
  - title: Access to emerging talent
    blurb: >-
      Meet students who are actively building skills and looking for
      internships and first roles in security.
  - title: Visibility on campus
    blurb: >-
      Your name on event materials, challenge categories, and prizes seen by
      the whole Kean community.
  - title: Support diversity in cyber
    blurb: >-
      Back a chapter whose mission is recruiting, retaining, and advancing
      women in cybersecurity.
  - title: Community goodwill
    blurb: >-
      Show students early what your organization stands for before they enter
      the job market.
