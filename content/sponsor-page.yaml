intro: >-
  Supporting WiCyS Kean does not require a large budget. Every contribution
  helps us create more welcoming, affordable, and valuable experiences for
  students interested in cybersecurity. Whether you help provide food for a
  meeting, supplies for an event, prizes, or learning resources, your support
  makes a real difference.
benefits:
  - title: Make a visible impact
    blurb: >-
      Help remove everyday costs that can keep students from participating in
      valuable programs and community events.
  - title: Visibility on campus
    blurb: >-
      Your name on event materials, challenge categories, and prizes seen by
      the whole Kean community.
  - title: Support diversity in cyber
    blurb: >-
      Back a chapter whose mission is recruiting, retaining, and advancing
      women in cybersecurity.
  - title: Community goodwill
    blurb: >-
      Show students early what your organization stands for before they enter
      the job market.
