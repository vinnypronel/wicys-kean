previousTitle: Kean University Capture the Flag, March 2026
overview: >-
  On March 20, 2026, Kean University hosted a virtual Capture the Flag
  competition designed to sharpen students' cybersecurity skills. The event
  was free, beginner-friendly, and open to students from any institution, with
  no prior experience required.
participantsNote: Teams of three
topics:
  - Web exploitation
  - Cryptography
  - Digital forensics
  - Reverse engineering
  - Open source intelligence
  - Binary exploitation
highlights:
  - Free and beginner-friendly, open to students from any institution
  - Teams of three competing for prizes
  - Guest speakers from industry
plannedBlurb: >-
  The next WiCyS Kean CTF is currently being planned. It will be a
  beginner-friendly, jeopardy-style competition open to all Kean students,
  with challenges across web, crypto, forensics, and more. Check back for
  dates and registration.
goals:
  - Welcome first-time players with easy entry-level challenges
  - Run a full jeopardy board across six categories
  - Provide prizes for top teams and raffle giveaways for attendees
timeline:
  - September 2026 - Finalize date, venue, and platform
  - October 2026 - Sponsor outreach and prize planning
  - November 2026 - Challenge development and testing
  - Spring 2027 - Event weekend
participateSteps:
  - Join the chapter Discord to get announcements first
  - Watch for the registration link once the date is announced
  - Form a team of up to four students, or register solo and we will match you
  - No experience required, we run a prep workshop before the event
