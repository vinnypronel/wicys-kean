name: Optimize uploaded images

on:
  push:
    branches: [main]
    paths:
      - 'public/images/uploads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run images

      - name: Commit smaller images
        run: |
          if git diff --quiet; then
            echo "Nothing to optimize."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/uploads
          git commit -m "Optimize uploaded images"
          git pull --rebase
          git push
